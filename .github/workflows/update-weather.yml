name: Update Plano temperatures

on:
  # Times are UTC and avoid the top of the hour, when GitHub's scheduler is
  # busiest and runs can start hours late. The second run is a backup: it
  # fetches whatever the first missed and commits nothing if nothing changed.
  schedule:
    - cron: "43 8 * * *"    # 2:43 AM Central (3:43 AM during daylight time)
    - cron: "37 12 * * *"   # 6:37 AM Central (7:37 AM during daylight time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and preserve daily temperatures
        run: python scripts/update_data.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: daily temperature update $(date -u +%Y-%m-%d)"
            git push
          fi
