name: Probe weather stations (temporary)
on:
  push:
    branches: [claude/dreamy-cray-ol3rbi]
    paths: [".github/workflows/probe-stations.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Coverage 1990-2007 and agreement with KTKI
        shell: python
        run: |
          import json, urllib.request, statistics as st
          def get(sid, s, e):
              body = json.dumps({"sid": sid, "sdate": s, "edate": e, "elems": "maxt,mint", "meta": "name,sids,valid_daterange"}).encode()
              req = urllib.request.Request("https://data.rcc-acis.org/StnData", data=body, headers={"Content-Type": "application/json"})
              d = json.load(urllib.request.urlopen(req, timeout=120))
              def n(v):
                  try: return float(v)
                  except: return None
              return d.get("meta", {}), {r[0]: (n(r[1]), n(r[2])) for r in d.get("data", []) if n(r[1]) is not None and n(r[2]) is not None}
          _, ktki = get("53914 1", "1990-01-01", "2010-12-31")
          print("KTKI first day:", min(ktki) if ktki else None)
          for sid in ["USC00415766 6", "415766 2", "MKET2 7", "USC00417588 6", "13960 1", "03927 1"]:
              try:
                  meta, d = get(sid, "1990-01-01", "2010-12-31")
              except Exception as ex:
                  print(sid, "ERROR", ex); continue
              print(f"\n== {sid}: {meta.get('name')} sids={meta.get('sids')} range={meta.get('valid_daterange')}")
              print("  days per year:", {y: sum(1 for k in d if k.startswith(str(y))) for y in range(1990, 2011)})
              both = sorted(set(d) & set(ktki))
              if both:
                  dh = [d[k][0] - ktki[k][0] for k in both]; dl = [d[k][1] - ktki[k][1] for k in both]
                  same = sum(1 for k in both if d[k] == ktki[k])
                  print(f"  overlap with KTKI: {len(both)} days {both[0]}..{both[-1]}; identical {same}; "
                        f"high diff mean {st.mean(dh):+.2f} sd {st.pstdev(dh):.2f}; low diff mean {st.mean(dl):+.2f} sd {st.pstdev(dl):.2f}")
