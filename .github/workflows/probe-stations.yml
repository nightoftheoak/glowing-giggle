name: Probe weather stations (temporary)
on:
  push:
    branches: [claude/dreamy-cray-ol3rbi]
    paths: [".github/workflows/probe-stations.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List stations near Plano with daily max/min and coverage since 2006
        shell: python
        run: |
          import json, urllib.request, datetime as dt
          def post(ep, p):
              req = urllib.request.Request("https://data.rcc-acis.org/" + ep, data=json.dumps(p).encode(), headers={"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=120))
          end = (dt.date.today() - dt.timedelta(days=1)).isoformat()
          meta = post("StnMeta", {"bbox": "-97.10,32.80,-96.40,33.35", "elems": "maxt,mint",
                                  "meta": "name,sids,ll,valid_daterange", "sdate": "2006-01-01", "edate": end})
          import math
          plano = (-96.6989, 33.0198)
          rows = []
          for s in meta["meta"]:
              vr = s.get("valid_daterange") or []
              if not vr or not vr[0]: continue
              dist = math.hypot((s["ll"][0]-plano[0])*93, (s["ll"][1]-plano[1])*111) * 0.621
              rows.append((dist, s))
          rows.sort(key=lambda r: r[0])
          for dist, s in rows[:25]:
              sid = s["sids"][0]
              d = post("StnData", {"sid": sid, "sdate": "2006-01-01", "edate": end, "elems": "maxt,mint"})
              data = d.get("data", [])
              n = len(data); ok = sum(1 for r in data if r[1] not in ("M", "") and r[2] not in ("M", ""))
              recent = [r for r in data[-10:]]
              print(f"{dist:5.1f} mi | {s['name'][:32]:32} | sids={s['sids']} | range={s['valid_daterange']} | complete {ok}/{n} ({100*ok/max(n,1):.1f}%) | last={recent[-3:]}")
